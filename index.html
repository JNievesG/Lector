async function readDocx(f){await ld('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');return(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value}
async function readImg(f){return(await ocrRun([()=>f])).join('\n')}
async function onFile(f){if(!f)return;busy(t('load'));try{let x='';if(/\.pdf$/i.test(f.name)||f.type==='application/pdf')x=await readPdf(f);else if(/\.docx$/i.test(f.name))x=await readDocx(f);else if((f.type||'').startsWith('image/')||/\.(jpe?g|png|webp|heic)$/i.test(f.name))x=await readImg(f);else x=await f.text();if(/\.html?$/i.test(f.name))x=new DOMParser().parseFromString(x,'text/html').body.textContent;x=x.trim();if(x.length<5)throw new Error('scan');busy('');addDoc(f.name.replace(/\.[^.]+$/,''),x)}catch(e){busy('');alert(e.message==='scan'?t('scan'):t('err')+' ('+(e.message||e)+')')}$('#file').value=''}
/* wiring */
$('#go').onclick=()=>{const x=$('#ta').value.trim();if(!x)return;addDoc(x.slice(0,40).replace(/\s+/g,' ')||t('untitled'),x);$('#ta').value=''};
$('#file').onchange=e=>onFile(e.target.files[0]);$('#cam').onchange=e=>onFile(e.target.files[0]);
$('#pp').onclick=()=>S.playing?pause():play();$('#pv').onclick=()=>jump(-1);$('#nx').onclick=()=>jump(1);$('#back').onclick=closeDoc;
$('#text').onclick=e=>{const s=e.target.closest('span[data-i]');if(s){S.i=+s.dataset.i;play()}};
$('#rl').onclick=()=>{S.mode={auto:'en',en:'es',es:'auto'}[S.mode||'auto'];if(S.cur){S.cur.lang=S.mode==='auto'?'':S.mode;save('lib',S.lib)}tag();ui();busy(t('m'+S.mode));setTimeout(()=>busy(''),3500);if(S.playing)speak()};
$('#lg').onclick=()=>{S.ui=S.ui==='en'?'es':'en';save('ui',S.ui);i18n()};
$('#gear').onclick=()=>{$('#rate').value=S.set.rate;$('#size').value=S.set.size;$('#rv').textContent=S.set.rate+'×';$('#sv').textContent=S.set.size;fillVoices();$('#sheet').hidden=false};
$('#close').onclick=()=>$('#sheet').hidden=true;
$('#rate').oninput=e=>{S.set.rate=+e.target.value;$('#rv').textContent=S.set.rate+'×';save('set',S.set)};
$('#rate').onchange=()=>{if(S.playing)speak()};
$('#size').oninput=e=>{S.set.size=+e.target.value;$('#sv').textContent=S.set.size;$('#text').style.fontSize=S.set.size+'px';save('set',S.set)};
['en','es'].forEach(l=>$('#v'+l).onchange=e=>{S.set['v'+l]=e.target.value;save('set',S.set);if(S.playing&&S.lang===l)speak()});
document.addEventListener('visibilitychange',()=>{if(S.playing&&window.speechSynthesis&&!speechSynthesis.speaking)speak()});
$('#test').onclick=()=>{if(!window.speechSynthesis)return alert(t('vhelp'));pause();const u=new SpeechSynthesisUtterance(S.ui==='es'?'Hola, esta es la voz seleccionada.':'Hello, this is the selected voice.');const v=pick(S.ui);if(v){u.voice=v;u.lang=v.lang}else u.lang=S.ui==='es'?'es-ES':'en-US';u.rate=+S.set.rate;speechSynthesis.cancel();speechSynthesis.speak(u)};
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#inst').hidden=false});
$('#inst').onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;$('#inst').hidden=true};
addEventListener('appinstalled',()=>$('#inst').hidden=true);
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
i18n();
</script></body></html>
